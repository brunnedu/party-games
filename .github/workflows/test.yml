name: Test pull requests

on:
  pull_request:
    branches: [main]

# Pull request code needs no more than reading the repository.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Type check and build. Needs no Supabase settings.
      - run: npm run build
